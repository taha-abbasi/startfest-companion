    <text x="140" y="110" font-size="26" font-weight="800"><tspan fill="#ffffff">StartFest </tspan><tspan fill="#c6f23e">2026</tspan></text>
  </g>

  <text x="64" y="200" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="-1">Meet your</text>
  <text x="64" y="268" fill="#c6f23e" font-size="60" font-weight="800" letter-spacing="-1">StartFest Pal.</text>
  <text x="64" y="316" fill="#aebfe0" font-size="23">Connect with fellow Slopers, capture every session,</text>
  <text x="64" y="348" fill="#aebfe0" font-size="23">and never take a frantic note again. Free, in your browser.</text>

