  <rect x="64" y="1144" width="952" height="196" rx="32" fill="#c6f23e"/>
  <text x="104" y="1206" fill="#08153a" fill-opacity="0.65" font-size="17" font-weight="800" letter-spacing="2.5">TRY IT NOW — FREE, NO INSTALL</text>
