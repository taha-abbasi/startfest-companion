<svg viewBox="0 0 1080 1440" width="1080" height="1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="ttl">StartFest Pal — your StartFest companion app</title>
  <desc id="desc">Six features: the Lounge chat, per-session chat and notes, snap slides and QR codes, live transcription, AI highlights, and a Slopers directory. Try it free at tinyurl.com/StartFestPal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061634"/>
      <stop offset="0.35" stop-color="#082155"/>
      <stop offset="0.7" stop-color="#0a346e"/>
      <stop offset="1" stop-color="#0c5572"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6f23e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c6f23e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="1440" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="520" fill="url(#dots)"/>
  <circle cx="980" cy="120" r="320" fill="url(#glow)"/>

  <g>
