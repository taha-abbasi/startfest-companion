<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="ttl">StartFest Pal — your StartFest companion app</title>
  <desc id="desc">Six features: up next and rooms, see who's going, spot what's popular, record and transcribe with AI highlights, chat with everyone via the Lounge and per-session chat, and the Slopers directory. Free at tinyurl.com/StartFestPal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061634"/><stop offset="0.4" stop-color="#082155"/>
      <stop offset="0.75" stop-color="#0a346e"/><stop offset="1" stop-color="#0c5572"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6f23e" stop-opacity="0.16"/><stop offset="1" stop-color="#c6f23e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.05"/></pattern>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="760" height="1080" fill="url(#dots)"/>
  <circle cx="430" cy="120" r="360" fill="url(#glow)"/>

  <rect x="70" y="66" width="56" height="56" rx="16" fill="#ffffff"/>
  <path d="M88 82 L112 94 L88 106 Z" fill="#0a2461"/>
  <text x="144" y="90" fill="#c6f23e" font-size="16" font-weight="800" letter-spacing="4">SILICON SLOPES</text>
  <text x="144" y="118" font-size="24" font-weight="800"><tspan fill="#ffffff">StartFest </tspan><tspan fill="#c6f23e">2026</tspan></text>

  <text x="70" y="232" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1">Meet your</text>
  <text x="70" y="296" fill="#c6f23e" font-size="56" font-weight="800" letter-spacing="-1">StartFest Pal.</text>
  <text x="70" y="346" fill="#aebfe0" font-size="22">Navigate the day, capture every session,</text>
  <text x="70" y="376" fill="#aebfe0" font-size="22">and meet the room. Free, in your browser.</text>

  <rect x="70" y="468" width="560" height="468" rx="30" fill="#c6f23e"/>
  <rect x="240" y="506" width="220" height="220" rx="18" fill="#ffffff"/>
  <image x="250" y="516" width="200" height="200" href="data:image/png;base64,"/>
  <text x="350" y="784" text-anchor="middle" fill="#08153a" fill-opacity="0.62" font-size="17" font-weight="800" letter-spacing="2.5">TRY IT FREE — NO INSTALL</text>
  <text x="350" y="838" text-anchor="middle" fill="#08153a" font-size="34" font-weight="800" letter-spacing="-0.5">tinyurl.com/StartFestPal</text>
  <text x="350" y="880" text-anchor="middle" fill="#08153a" fill-opacity="0.72" font-size="19">Scan the code or open it on any phone</text>

